name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: tests, lint and types (green)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Types
        run: mypy src
      - name: Tests excluding the deliberate defects
        run: >
          pytest -q
          --ignore=tests/test_fx.py
          --ignore=tests/test_calendar.py
          --ignore=tests/test_simulator.py
      - name: Submission schema
        run: |
          make submit
          python -c "from noyyal.submission import validate_forecast, validate_buffer, validate_hedge; import pandas as pd, json; from noyyal.io.loaders import load_bundle; b=load_bundle('data/public'); validate_forecast(pd.read_csv('submission/forecast.csv')); validate_buffer(pd.read_csv('submission/buffer_plan.csv'), b.terms); validate_hedge(json.load(open('submission/hedge.json')), b.receivables)"

  known-defects:
    name: known defects (allowed to fail until fixed)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: ISSUE-01, ISSUE-03 and ISSUE-05 are expected to fail here
        run: pytest -q tests/test_fx.py tests/test_calendar.py tests/test_simulator.py
